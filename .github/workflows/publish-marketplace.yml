name: Publish VS Code Marketplace

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to publish, for example v1.0.0
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run check
      - run: xvfb-run -a npm run test:integration
      - run: npm run test:web
      - run: npm run package
      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "${RELEASE_TAG#v}" = "$(node -p "require('./apps/vscode/package.json').version")"
          test "$(node -p "require('./apps/vscode/package.json').publisher")" = nuxyel
      - name: Require Marketplace credential
        run: test -n "$VSCE_PAT"
      - name: Publish VSIX to Visual Studio Marketplace
        run: |
          VERSION="$(node -p "require('./apps/vscode/package.json').version")"
          npx --yes @vscode/vsce publish \
            --packagePath "apps/vscode/bend2-vscode-${VERSION}.vsix" \
            --pat "$VSCE_PAT"
